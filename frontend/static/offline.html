<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0b0c0e" />
		<title>Sin conexión · HomeLabDash</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #fbfbfd;
				--surface: #ffffff;
				--ink: #1d1d1f;
				--ink-2: #6e6e73;
				--line: rgba(0, 0, 0, 0.08);
				--accent: #2e6bff;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0b0c0e;
					--surface: #141518;
					--ink: #f5f5f7;
					--ink-2: #a7abb3;
					--line: rgba(255, 255, 255, 0.1);
					--accent: #5b8cff;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: 1.5rem;
				background: var(--bg);
				color: var(--ink);
				font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto,
					Helvetica, Arial, sans-serif;
			}
			.card {
				width: 100%;
				max-width: 420px;
				background: var(--surface);
				border: 1px solid var(--line);
				border-radius: 24px;
				padding: 2rem;
				text-align: center;
			}
			.mark {
				width: 64px;
				height: 64px;
			}
			h1 {
				margin: 1rem 0 0.35rem;
				font-size: 1.35rem;
			}
			p {
				margin: 0;
				color: var(--ink-2);
				font-size: 0.9rem;
				line-height: 1.55;
			}
			a {
				display: inline-flex;
				margin-top: 1.4rem;
				padding: 0.7rem 1.1rem;
				border-radius: 12px;
				background: var(--accent);
				color: #fff;
				text-decoration: none;
				font-size: 0.9rem;
				font-weight: 600;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<img class="mark" src="/brand/logo-mark.png" alt="" />
			<h1>Sin conexión</h1>
			<p>
				No se puede contactar con HomeLabDash. El shell de la aplicación sigue disponible, pero
				las métricas necesitan conexión con el servidor.
			</p>
			<a href="/">Reintentar</a>
		</div>
	</body>
</html>
