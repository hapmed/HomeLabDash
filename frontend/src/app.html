<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#0b0c0e" />
		<meta name="description" content="Dashboard de monitorización del HomeLab." />
		<title>HomeLabDash</title>
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/brand/favicon-64.png" sizes="64x64" />
		<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="HomeLab" />
		%sveltekit.head%
		<script>
			try {
				const stored = localStorage.getItem('hld-theme');
				const dark = stored
					? stored === 'dark'
					: window.matchMedia('(prefers-color-scheme: dark)').matches;
				if (dark) document.documentElement.classList.add('dark');
			} catch (e) {
				/* sin acceso a storage */
			}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
